[platformio]
src_dir = main
default_envs = esp32-h2

[env:esp32-h2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
platform_packages =
    pioarduino/framework-espidf@https://github.com/pioarduino/esp-idf/releases/download/v5.5.5/esp-idf-v5.5.5.tar.xz
    platformio/toolchain-riscv32-esp@14.2.0+20260121
board = esp32-h2-devkitm-1
framework = espidf
board_build.flash_mode = dio
board_build.f_flash = 32000000L
board_build.f_image = 24000000L
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.app_partition_name = factory
extra_scripts = post:scripts/factory_offset.py
upload_speed = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++2b -std=gnu++23
build_flags = -std=gnu++17
